services:
  mysql_db:
    image: mysql:8.0
    container_name: farmayopin_mysql
    environment:
      MYSQL_DATABASE: farmayopin_db
      MYSQL_ROOT_PASSWORD: rootpassword
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data: